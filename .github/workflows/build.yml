name: Build Suburban Channel

on:
  workflow_dispatch:
    inputs:
      include_mac:
        description: "Also build macOS (uses 10x the free minutes on private repos)"
        type: boolean
        default: false
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DSP tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra tests/dsp_test.cpp -o dsp_test
          ./dsp_test
      - name: Processor tests (real plugin logic on a JUCE stand-in)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -DSC_TEST_NO_EDITOR -Itests/stub_fn -ISource tests/processor_test.cpp Source/PluginProcessor.cpp -o processor_test
          ./processor_test

  build:
    needs: dsp-tests
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.include_mac == 'true' && '["windows-latest","macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: SuburbanChannel-${{ matrix.os }}
          path: |
            build/SuburbanChannel_artefacts/Release/VST3
            build/SuburbanChannel_artefacts/Release/AU
            build/SuburbanChannel_artefacts/Release/Standalone
          if-no-files-found: warn
